<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Confirmar presença — Alice & Lucas</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--bg:#f5efe7;--card:#fffdf9;--ink:#46523f;--muted:#74786e;--sage:#68795f;--rose:#d7a09c;--line:rgba(70,82,63,.16)}*{box-sizing:border-box}body{margin:0;background:#ebe5dc;color:var(--ink);font-family:Inter,Arial,sans-serif}.wrap{width:min(100%,680px);min-height:100vh;margin:auto;background:linear-gradient(180deg,#fbf7f1,var(--bg));padding:22px 14px 44px}.back{display:inline-block;color:var(--sage);text-decoration:none;font-size:12px;font-weight:600;margin-bottom:28px}.head{text-align:center;margin-bottom:24px}.eyebrow{font-size:10px;letter-spacing:.23em;text-transform:uppercase;color:var(--rose);font-weight:600}.head h1{font:600 clamp(42px,9vw,58px)/1 "Cormorant Garamond",serif;margin:10px 0}.intro{font:500 18px/1.5 "Cormorant Garamond",serif;color:var(--muted);margin:auto;max-width:520px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 14px 35px #3a302410}.field{margin-bottom:18px}.label{display:block;font-size:11px;font-weight:600;margin-bottom:7px}.input,.textarea{width:100%;border:1px solid #d8d1c7;border-radius:13px;background:#fff;color:var(--ink);font-size:15px;outline:none}.input{height:52px;padding:0 14px}.textarea{min-height:90px;padding:13px 14px;resize:vertical}.question{font:600 25px/1.1 "Cormorant Garamond",serif;margin:4px 0 12px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{border:1px solid var(--line);background:#fff;border-radius:15px;min-height:76px;padding:12px;color:var(--ink);font-weight:600;cursor:pointer}.choice small{display:block;font-size:10px;font-weight:400;color:var(--muted);margin-top:4px}.choice.active.yes{border-color:var(--sage);background:#f1f6ef}.choice.active.no{border-color:var(--rose);background:#fff4f3}.people{display:none;margin-top:20px}.people.show{display:block}.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px}.stepper button,.count{height:52px;border:1px solid var(--line);border-radius:13px;background:#fff}.stepper button{font-size:24px;color:var(--sage);cursor:pointer}.count{display:grid;place-items:center;font-weight:600;font-size:18px}.hint{font-size:10px;color:var(--muted);margin-top:7px}.submit{width:100%;min-height:54px;border:0;border-radius:14px;background:var(--sage);color:#fff;font-weight:600;cursor:pointer;margin-top:8px}.submit:disabled{opacity:.55}.error{display:none;margin:12px 0 0;padding:11px 12px;border-radius:11px;background:#fff1ef;color:#985a54;font-size:11px}.error.show{display:block}.result{display:none;text-align:center;padding:8px 0}.result.show{display:block}.form.hide{display:none}.check{width:70px;height:70px;border-radius:50%;margin:4px auto 16px;background:#eef4eb;color:var(--sage);display:grid;place-items:center;font-size:34px}.result h2{font:600 34px/1 "Cormorant Garamond",serif;margin:0 0 10px}.result p{color:var(--muted);font-size:13px;line-height:1.55;margin:0 auto 18px;max-width:430px}.edit{width:100%;min-height:48px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);font-weight:600;cursor:pointer}@media(max-width:520px){.choices{grid-template-columns:1fr}.card{padding:17px}}</style></head><body><main class="wrap"><a class="back" href="/">← Voltar ao casamento</a><section class="head"><div class="eyebrow">Alice & Lucas · 07.11.2026</div><h1>Confirmar presença</h1><p class="intro">Sua resposta será registrada na lista do casamento.</p></section><section class="card"><div id="form" class="form"><div class="field"><label class="label" for="guestName">Nome do convidado ou família *</label><input class="input" id="guestName" autocomplete="name" placeholder="Ex.: Família Riske"></div><div class="question">Você estará conosco?</div><div class="choices"><button id="yesBtn" class="choice yes" type="button">✓ Sim, estarei presente<small>Será uma alegria celebrar juntos</small></button><button id="noBtn" class="choice no" type="button">Não poderei ir<small>Obrigado por nos avisar</small></button></div><div id="peopleBox" class="people"><div class="question">Quantas pessoas irão?</div><div class="stepper"><button type="button" id="minus">−</button><div id="count" class="count">1</div><button type="button" id="plus">+</button></div><div class="hint">Inclua você e os acompanhantes desta confirmação.</div></div><div class="field" style="margin-top:20px"><label class="label" for="note">Observação (opcional)</label><textarea id="note" class="textarea" placeholder="Ex.: nomes dos acompanhantes..."></textarea></div><div id="error" class="error"></div><button id="submit" class="submit" type="button">Confirmar resposta</button></div><div id="result" class="result"><div class="check">✓</div><h2>Resposta confirmada!</h2><p id="resultText"></p><button class="edit" type="button" id="editBtn">Alterar resposta</button></div></section></main><script>const URL='https://script.google.com/macros/s/AKfycbzbTU3rLr7e4ewTW8USS2NwuSbQliD66lJuh2PFlVS-YSRqBbOJ16eJYCTOQBWSg5bKLg/exec';let answer='',people=1;const $=id=>document.getElementById(id);function choose(v){answer=v;$('yesBtn').classList.toggle('active',v==='sim');$('noBtn').classList.toggle('active',v==='nao');$('peopleBox').classList.toggle('show',v==='sim');$('error').classList.remove('show')}$('yesBtn').onclick=()=>choose('sim');$('noBtn').onclick=()=>choose('nao');$('minus').onclick=()=>{people=Math.max(1,people-1);$('count').textContent=people};$('plus').onclick=()=>{people=Math.min(20,people+1);$('count').textContent=people};$('submit').onclick=async()=>{const name=$('guestName').value.trim(),note=$('note').value.trim();if(!name){$('error').textContent='Informe o nome do convidado ou da família.';$('error').classList.add('show');return}if(!answer){$('error').textContent='Escolha Sim ou Não.';$('error').classList.add('show');return}const payload={name,answer,people:answer==='sim'?people:0,note};$('submit').disabled=true;$('submit').textContent='Confirmando...';try{await fetch(URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});localStorage.setItem('aliceLucasRSVP',JSON.stringify(payload));$('form').classList.add('hide');$('result').classList.add('show');$('resultText').textContent=answer==='sim'?`${name}, presença confirmada para ${people} ${people===1?'pessoa':'pessoas'}.`:`${name}, registramos que você não poderá comparecer.`}catch(e){$('error').textContent='Não foi possível enviar agora. Tente novamente.';$('error').classList.add('show')}finally{$('submit').disabled=false;$('submit').textContent='Confirmar resposta'}};$('editBtn').onclick=()=>{$('result').classList.remove('show');$('form').classList.remove('hide')};</script></body></html>
