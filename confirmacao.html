<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f3ec">
<title>Confirmar presença — Alice & Lucas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5efe7;--card:#fffdf9;--ink:#46523f;--muted:#74786e;--sage:#68795f;--rose:#d7a09c;--line:rgba(70,82,63,.16)}*{box-sizing:border-box}body{margin:0;background:#ebe5dc;color:var(--ink);font-family:Inter,Arial,sans-serif}.wrap{width:min(100%,680px);min-height:100vh;margin:auto;background:linear-gradient(180deg,#fbf7f1,var(--bg));padding:22px 14px 44px}.back{display:inline-block;color:var(--sage);text-decoration:none;font-size:12px;font-weight:600;margin-bottom:28px}.head{text-align:center;margin-bottom:24px}.eyebrow{font-size:10px;letter-spacing:.23em;text-transform:uppercase;color:var(--rose);font-weight:600}.head h1{font:600 clamp(42px,9vw,58px)/1 "Cormorant Garamond",serif;margin:10px 0}.intro{font:500 18px/1.5 "Cormorant Garamond",serif;color:var(--muted);margin:auto;max-width:520px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 14px 35px #3a302410}.field{margin-bottom:18px}.label{display:block;font-size:11px;font-weight:600;margin-bottom:7px}.input,.textarea{width:100%;border:1px solid #d8d1c7;border-radius:13px;background:#fff;color:var(--ink);font-size:15px;outline:none}.input{height:52px;padding:0 14px}.textarea{min-height:90px;padding:13px 14px;resize:vertical}.question{font:600 25px/1.1 "Cormorant Garamond",serif;margin:4px 0 12px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{border:1px solid var(--line);background:#fff;border-radius:15px;min-height:76px;padding:12px;color:var(--ink);font-weight:600;cursor:pointer}.choice small{display:block;font-size:10px;font-weight:400;color:var(--muted);margin-top:4px}.choice.yes.active{border-color:var(--sage);background:#f1f6ef}.choice.no.active{border-color:var(--rose);background:#fff4f3}.people{display:none;margin-top:20px}.people.show{display:block}.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px}.stepper button,.count{height:52px;border:1px solid var(--line);border-radius:13px;background:#fff}.stepper button{font-size:24px;color:var(--sage);cursor:pointer}.count{display:grid;place-items:center;font-weight:600;font-size:18px}.hint{font-size:10px;color:var(--muted);margin-top:7px}.submit{width:100%;min-height:54px;border:0;border-radius:14px;background:var(--sage);color:#fff;font-weight:600;cursor:pointer;margin-top:8px}.submit:disabled{opacity:.55;cursor:not-allowed}.error{display:none;margin:12px 0 0;padding:11px 12px;border-radius:11px;background:#fff1ef;color:#985a54;font-size:11px}.error.show{display:block}.result{display:none;text-align:center;padding:8px 0}.result.show{display:block}.form.hide{display:none}.check{width:70px;height:70px;border-radius:50%;margin:4px auto 16px;background:#eef4eb;color:var(--sage);display:grid;place-items:center;font-size:34px}.result h2{font:600 34px/1 "Cormorant Garamond",serif;margin:0 0 10px}.result p{color:var(--muted);font-size:13px;line-height:1.55;margin:0 auto 18px;max-width:430px}.secondary{display:block;width:100%;min-height:48px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);font-weight:600;cursor:pointer}.status{font-size:10px;color:var(--muted);text-align:center;margin-top:10px}@media(max-width:520px){.choices{grid-template-columns:1fr}.card{padding:17px}}
</style>
</head>
<body>
<main class="wrap">
<a class="back" href="/">← Voltar ao casamento</a>
<section class="head"><div class="eyebrow">Alice & Lucas · 07.11.2026</div><h1>Confirmar presença</h1><p class="intro">Sua resposta nos ajuda a preparar tudo com carinho. Leva menos de um minuto.</p></section>
<section class="card">
<div id="form" class="form">
  <div class="field"><label class="label" for="guestName">Nome do convidado ou família *</label><input class="input" id="guestName" autocomplete="name" placeholder="Ex.: Família Riske"></div>
  <div class="question">Você estará conosco?</div>
  <div class="choices">
    <button id="yesBtn" class="choice yes" type="button" onclick="setAnswer('sim')">✓ Sim, estarei presente<small>Será uma alegria celebrar juntos</small></button>
    <button id="noBtn" class="choice no" type="button" onclick="setAnswer('nao')">Não poderei ir<small>Obrigado por nos avisar</small></button>
  </div>
  <div id="peopleBox" class="people"><div class="question">Quantas pessoas irão?</div><div class="stepper"><button type="button" onclick="changeCount(-1)">−</button><div id="count" class="count">1</div><button type="button" onclick="changeCount(1)">+</button></div><div class="hint">Inclua você e os acompanhantes desta confirmação.</div></div>
  <div class="field" style="margin-top:20px"><label class="label" for="note">Observação (opcional)</label><textarea id="note" class="textarea" placeholder="Ex.: nomes dos acompanhantes..."></textarea></div>
  <div id="error" class="error"></div>
  <button id="submit" class="submit" type="button" disabled onclick="confirmRSVP()">Confirmar resposta</button>
  <div id="status" class="status"></div>
</div>
<div id="result" class="result"><div class="check">✓</div><h2>Resposta confirmada!</h2><p id="resultText"></p><button class="secondary" type="button" onclick="editRSVP()">Alterar resposta</button></div>
</section>
</main>
<script>
let answer='', people=1;
function setAnswer(v){answer=v;yesBtn.classList.toggle('active',v==='sim');noBtn.classList.toggle('active',v==='nao');peopleBox.classList.toggle('show',v==='sim');submit.disabled=false;error.classList.remove('show')}
function changeCount(d){people=Math.min(20,Math.max(1,people+d));count.textContent=people}
async function confirmRSVP(){const name=guestName.value.trim();if(!name){error.textContent='Informe o nome do convidado ou da família.';error.classList.add('show');guestName.focus();return}if(!answer){error.textContent='Escolha Sim ou Não.';error.classList.add('show');return}const data={name,answer,people:answer==='sim'?people:0,note:note.value.trim()};submit.disabled=true;submit.textContent='Confirmando…';status.textContent='Enviando sua resposta...';error.classList.remove('show');try{const r=await fetch('/api/rsvp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const res=await r.json().catch(()=>({}));if(!r.ok||!res.success)throw new Error(res.error||'Não foi possível registrar a confirmação.');localStorage.setItem('aliceLucasRSVP',JSON.stringify(data));resultText.textContent=answer==='sim'?`${name}, sua presença foi confirmada para ${people} ${people===1?'pessoa':'pessoas'}.`:`${name}, recebemos sua informação de que não poderá comparecer.`;form.classList.add('hide');result.classList.add('show')}catch(e){error.textContent=e.message||'Não foi possível registrar a confirmação. Tente novamente.';error.classList.add('show');status.textContent='';submit.disabled=false;submit.textContent='Confirmar resposta'}}
function editRSVP(){result.classList.remove('show');form.classList.remove('hide');submit.disabled=false;submit.textContent='Confirmar resposta';status.textContent=''}
(function(){try{const d=JSON.parse(localStorage.getItem('aliceLucasRSVP')||'null');if(!d)return;guestName.value=d.name||'';note.value=d.note||'';people=Math.max(1,d.people||1);count.textContent=people;if(d.answer)setAnswer(d.answer)}catch(e){}})();
</script>
</body>
</html>
