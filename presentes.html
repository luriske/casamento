<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lista de presentes — Alice & Lucas</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--card:#fffdf9;--ink:#44503c;--muted:#77796f;--sage:#65745a;--rose:#d7a09c;--line:rgba(68,80,60,.14)}*{box-sizing:border-box}body{margin:0;background:#ece6dd;color:var(--ink);font-family:Inter,Arial,sans-serif}.site{width:min(100%,980px);margin:auto;background:#faf6ef;min-height:100vh;padding-bottom:80px}.top{padding:24px 18px 10px}.top a{color:var(--sage);text-decoration:none;font-size:12px;font-weight:600}.hero{text-align:center;padding:15px 20px 30px}h1{font:500 clamp(44px,8vw,68px)/.95 'Cormorant Garamond',serif;margin:8px 0}.hero p{color:var(--muted);font:400 18px 'Cormorant Garamond',serif}.grid{padding:0 16px;display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}.photo{width:100%;aspect-ratio:4/3;object-fit:cover;background:#ebe6de}.content{padding:16px;display:flex;flex-direction:column;flex:1}.content h3{font:600 24px/1.05 'Cormorant Garamond',serif;margin:0 0 7px}.price{font-weight:600;margin-bottom:8px}.desc{font-size:12px;color:var(--muted);flex:1}.btn{border:0;background:var(--sage);color:#fff;border-radius:12px;min-height:46px;font-weight:600}.overlay{display:none;position:fixed;inset:0;background:#0007;z-index:50;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.modal{background:#fffdf9;width:min(100%,620px);max-height:95vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px}.close{float:right;border:0;background:#eee;border-radius:50%;width:40px;height:40px;font-size:22px}.modal h2{font:600 30px 'Cormorant Garamond',serif}.input{width:100%;height:48px;margin:6px 0 10px;border:1px solid #ddd;border-radius:10px;padding:10px}.methods{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}.method{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left}.method.active{border-color:var(--sage);background:#f3f7f1}.bank{display:none;background:#f5f2ec;padding:12px;border-radius:12px}.bank.show{display:block}.pay{width:100%;min-height:50px;border:0;border-radius:12px;background:var(--sage);color:#fff;font-weight:600;margin-top:10px}.error{display:none;color:#9b5650;background:#fff0ee;padding:10px;border-radius:10px;margin-top:10px}.error.show{display:block}@media(max-width:600px){.grid{grid-template-columns:1fr}.card{display:grid;grid-template-columns:40% 60%;min-height:210px}.photo{height:100%;aspect-ratio:auto}.methods{grid-template-columns:1fr}}</style></head><body><main class="site"><div class="top"><a href="/">← Voltar ao casamento</a></div><section class="hero"><h1>Lista de presentes</h1><p>Escolha um presente. O presente livre está na 5ª posição.</p></section><section id="grid" class="grid"></section></main><div id="overlay" class="overlay"><div class="modal"><button id="close" class="close">×</button><h2 id="mname"></h2><div id="mprice" class="price"></div><img id="mimg" style="width:100%;max-height:260px;object-fit:cover;border-radius:14px"><div id="freeWrap" style="display:none"><input id="freeAmount" class="input" inputmode="numeric" placeholder="Valor em guaranis"></div><div id="payer"><input id="buyerName" class="input" placeholder="Seu nome"><input id="buyerEmail" class="input" type="email" placeholder="E-mail"><input id="buyerDocument" class="input" placeholder="Documento / CI"><input id="buyerPhone" class="input" placeholder="Telefone (opcional)"></div><div class="methods"><button class="method active" data-method="24">Pago QR</button><button class="method" data-method="9">Cartão</button><button class="method" data-method="bank">Transferência direta</button></div><div id="bank" class="bank"><b>Lucas Riske · Banco Itaú</b><br>Conta: 300701318<br>CI/Alias: 4685781</div><div id="error" class="error"></div><button id="pay" class="pay">Continuar para Pago QR</button></div></div><script>const gifts=[{"id":1,"name":"Cueca para o noivo","price":120000,"desc":"Pedido especial da noiva.","img":"/api/gifts-01?id=1"},{"id":2,"name":"Cesto de roupa com GPS","price":250000,"desc":"Para ajudar o noivo a descobrir onde a roupa suja mora.","img":"/api/gifts-01?id=2"},{"id":3,"name":"Cafeteira Espresso Barista","price":1460000,"desc":"Porque casamento feliz começa depois do primeiro café.","img":"/api/coffee-local"},{"id":4,"name":"Robô aspirador","price":700000,"desc":"Nosso primeiro funcionário doméstico.","img":"/api/robot-local"},{"id":5,"name":"Presente livre","price":null,"desc":"Escolha o valor que quiser.","img":"/api/gifts-03?id=5"},{"id":6,"name":"Lava-louças","price":4200000,"desc":"Um investimento direto na paz doméstica.","img":"/api/gifts-03?id=6"},{"id":7,"name":"1 mês de aluguel","price":2600000,"desc":"Um pedacinho dos primeiros meses juntos.","img":"/api/gifts-04?id=7"},{"id":8,"name":"Primeira compra grande do mercado","price":1000000,"desc":"Para abastecer a casa.","img":"/api/gifts-04?id=8"},{"id":9,"name":"Jogo de taças","price":450000,"desc":"Para brindar às boas notícias.","img":"/api/gifts-05?id=9"},{"id":10,"name":"Faqueiro bonito","price":650000,"desc":"Para o primeiro jantar em casa.","img":"/api/gifts-05?id=10"},{"id":11,"name":"Jogo de cama premium","price":800000,"desc":"Conforto para descansar.","img":"/api/gifts-06?id=11"},{"id":12,"name":"Malas de viagem","price":1200000,"desc":"Para começar nossas viagens.","img":"/api/gifts-06?id=12"},{"id":13,"name":"Passeio na lua de mel","price":600000,"desc":"Uma memória da lua de mel.","img":"/api/gifts-07?id=13"},{"id":14,"name":"Jantar especial","price":500000,"desc":"Uma noite especial.","img":"/api/gifts-07?id=14"},{"id":15,"name":"Brinde dos recém-casados","price":300000,"desc":"Para celebrar.","img":"/api/gifts-08?id=15"},{"id":16,"name":"Primeiras plantas da casa","price":280000,"desc":"Para deixar a casa mais verde.","img":"/api/gifts-08?id=16"},{"id":17,"name":"Kit de ferramentas","price":550000,"desc":"Para resolver as coisas em casa.","img":"/api/gift-17"},{"id":18,"name":"Jogo de panelas","price":1100000,"desc":"Essencial para a cozinha.","img":"/api/gift-18"},{"id":19,"name":"Fundo do primeiro sofá","price":900000,"desc":"Para o primeiro sofá.","img":"/api/gift-19"},{"id":20,"name":"Vale “Alice estava certa”","price":200000,"desc":"Um presente de alto valor emocional.","img":"/api/gift-20"}];let selected=null,method=24;const $=id=>document.getElementById(id);function gs(v){return v==null?'Valor livre':'Gs. '+Number(v).toLocaleString('es-PY')}$('grid').innerHTML=gifts.map(g=>`<article class="card"><img class="photo" src="${g.img}" alt="${g.name}"><div class="content"><h3>${g.name}</h3><div class="price">${gs(g.price)}</div><p class="desc">${g.desc}</p><button class="btn" onclick="openGift(${g.id})">Presentear</button></div></article>`).join('');window.openGift=id=>{selected=gifts.find(g=>g.id===id);$('mname').textContent=selected.name;$('mprice').textContent=gs(selected.price);$('mimg').src=selected.img;$('freeWrap').style.display=selected.id===5?'block':'none';$('overlay').classList.add('show')};$('close').onclick=()=>$('overlay').classList.remove('show');document.querySelectorAll('.method').forEach(b=>b.onclick=()=>{document.querySelectorAll('.method').forEach(x=>x.classList.remove('active'));b.classList.add('active');method=b.dataset.method==='bank'?'bank':Number(b.dataset.method);$('bank').classList.toggle('show',method==='bank');$('payer').style.display=method==='bank'?'none':'block';$('pay').textContent=method==='bank'?'Fechar':method===24?'Continuar para Pago QR':'Continuar para cartão'});$('pay').onclick=async()=>{if(method==='bank'){$('overlay').classList.remove('show');return};let amount=selected.price;if(selected.id===5){amount=Number(($('freeAmount').value||'').replace(/\D/g,''));if(!amount){$('error').textContent='Informe um valor.';$('error').classList.add('show');return}}const buyer={name:$('buyerName').value.trim(),email:$('buyerEmail').value.trim(),document:$('buyerDocument').value.trim(),phone:$('buyerPhone').value.trim()};if(!buyer.name||!buyer.email||!buyer.document){$('error').textContent='Informe nome, e-mail e documento.';$('error').classList.add('show');return}$('pay').disabled=true;try{const r=await fetch('/api/create-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({giftId:selected.id,giftName:selected.name,description:selected.desc,image:'',amount,paymentMethod:method,buyer})});const d=await r.json();if(!r.ok||!d.checkoutUrl)throw new Error(d.gatewayError||d.error||'Erro ao abrir pagamento');location.href=d.checkoutUrl}catch(e){$('error').textContent=e.message;$('error').classList.add('show')}finally{$('pay').disabled=false}};</script></body></html>
