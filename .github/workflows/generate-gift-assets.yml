name: Generate gift assets

on:
  push:
    branches: [main]
    paths:
      - 'scripts/export-gifts.js'
      - 'lib/**'
      - '.github/workflows/generate-gift-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate 20 static images
        run: node scripts/export-gifts.js
      - name: Validate generated assets
        shell: bash
        run: |
          count=$(find assets/presentes/final -maxdepth 1 -type f -name 'gift-*' | wc -l)
          test "$count" -eq 20
          for f in assets/presentes/final/gift-*; do test -s "$f"; done
      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/presentes/final
          if git diff --cached --quiet; then
            echo 'Assets already up to date.'
            exit 0
          fi
          git commit -m 'Gera 20 imagens estáticas dos presentes'
          git push
