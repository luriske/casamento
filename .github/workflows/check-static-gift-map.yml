name: Check static gift map
on:
  push:
    paths:
      - 'scripts/check-static-gift-map.js'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-static-gift-map.js
